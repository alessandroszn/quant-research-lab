# Values of section "Study 2: 1/N against optimised portfolios" (design note 6.3d).
# Main run: one-over-n/full (to the end of the vintage). Paper period: one-over-n/paper.

# --- Samples -------------------------------------------------------------------------

[values.s2_main_start]
run = "one-over-n/full"
table = "performance.csv"
where = { dataset = "industries_10", window = 120, cost_per_unit = 0.0, strategy = "ew" }
column = "start"
truncate = 7

