# --- Tables ---------------------------------------------------------------------------------

[tables.s3_in_sample]
run = "factor-zoo/clear"
table = "in_sample_counts.csv"
columns = [
    { column = "rule", header = "Rule" },
    { column = "significant", header = "Significant", decimals = 0 },
    { column = "tested", header = "Tested", decimals = 0 },
    { column = "share", header = "Share", decimals = 1, scale = 100, unit = " %" },
]

[tables.s3_post_publication]
run = "factor-zoo/clear"
table = "post_publication_counts.csv"
columns = [
