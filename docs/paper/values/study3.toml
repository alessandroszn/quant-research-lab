# Values of study 3, the factor zoo (design note 6.3d). Main run: "clear" predictors;
# robustness run: "clear" and "likely" predictors ("broad").

# --- Data and specification -------------------------------------------------------------

[values.s3_n_clear]
run = "factor-zoo/clear"
scalar = "predictors"
decimals = 0

[values.s3_n_broad]
run = "factor-zoo/broad"
scalar = "predictors"
decimals = 0

[values.s3_excl_clear]
run = "factor-zoo/clear"
scalar = "excluded_for_gaps"
decimals = 0

[values.s3_excl_broad]
run = "factor-zoo/broad"
scalar = "excluded_for_gaps"
decimals = 0

[values.s3_tried]
run = "factor-zoo/clear"
record = "configurations_tried"

[values.s3_end]
run = "factor-zoo/clear"
record = "config.content.parameters.end"
truncate = 7

[values.s3_is_start]
run = "factor-zoo/clear"
table = "composite_in_sample.csv"
where = { phase = "in_sample" }
column = "start"
truncate = 7

[values.s3_is_end]
run = "factor-zoo/clear"
table = "composite_in_sample.csv"
where = { phase = "in_sample" }
column = "end"
truncate = 7

[values.s3_pp_start]
run = "factor-zoo/clear"
table = "composites_later.csv"
where = { phase = "post_publication" }
column = "start"
truncate = 7

[values.s3_pp_end]
run = "factor-zoo/clear"
table = "composites_later.csv"
where = { phase = "post_publication" }
column = "end"
truncate = 7

# --- In-sample tests (H1), clear ----------------------------------------------------------

[values.s3_is_tested]
run = "factor-zoo/clear"
table = "in_sample_counts.csv"
where = { rule = "single test, p <= 0.05" }
column = "tested"
decimals = 0

[values.s3_is_single_share]
run = "factor-zoo/clear"
table = "in_sample_counts.csv"
where = { rule = "single test, p <= 0.05" }
column = "share"
decimals = 1
scale = 100
unit = " %"

[values.s3_is_t3_share]
run = "factor-zoo/clear"
table = "in_sample_counts.csv"
where = { rule = "t > 3 (HLZ)" }
column = "share"
decimals = 1
scale = 100
unit = " %"

[values.s3_is_holm_share]
run = "factor-zoo/clear"
table = "in_sample_counts.csv"
where = { rule = "Holm" }
column = "share"
decimals = 1
scale = 100
unit = " %"

[values.s3_is_bh_share]
run = "factor-zoo/clear"
table = "in_sample_counts.csv"
where = { rule = "Benjamini-Hochberg" }
column = "share"
decimals = 1
scale = 100
unit = " %"

[values.s3_is_by_share]
run = "factor-zoo/clear"
table = "in_sample_counts.csv"
where = { rule = "Benjamini-Yekutieli" }
column = "share"
decimals = 1
scale = 100
unit = " %"

