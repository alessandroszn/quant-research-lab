# Values of section 4 of the working paper (design note 6.3d): rebalancing for a EUR ETF
# investor. Main run 60/40, robustness run 80/20; 'low' and 'high' are the cost scenarios.

[values.s4_start]
run = "rebalancing/60_40"
truncate = 7
table = "asset_returns.csv"
where = { index = "2004-10-31" }
column = "index"

[values.s4_end]
run = "rebalancing/60_40"
truncate = 7
table = "asset_returns.csv"
where = { index = "2026-09-30" }
column = "index"

[values.s4_months]
run = "rebalancing/60_40"
scalar = "months"
decimals = 0

[values.s4_tried]
run = "rebalancing/60_40"
scalar = "configurations_tried"
decimals = 0

[values.s4_h_bh_wealth]
run = "rebalancing/60_40"
table = "historical.csv"
where = { scenario = "low", policy = "buy_and_hold" }
column = "after_tax_wealth"
scale = 0.001
decimals = 1
unit = "k EUR"

