# Values of the section 'Study 1: volatility-managed factors' (design note 6.3d).
# Runs: volatility-managed/full (main, data to 2026-09), /paper (data to 2015-12),
# /demeaned (demeaned daily returns in the realised variance).

# Run metadata

[values.s1_tried]
