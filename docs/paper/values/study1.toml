# Tables

[tables.s1_in_sample]
run = "volatility-managed/full"
table = "in_sample.csv"
columns = [
    { column = "factor", header = "Factor" },
    { column = "n", header = "Months", decimals = 0 },
    { column = "alpha_annual", header = "α p.a.", decimals = 2, scale = 100.0, unit = " %" },
    { column = "alpha_t", header = "t (HAC)", decimals = 2 },
    { column = "alpha_holm", header = "p Holm", decimals = 3 },
    { column = "beta", header = "β", decimals = 2 },
    { column = "appraisal_ratio", header = "Appraisal p.a.", decimals = 2 },
    { column = "r_squared", header = "R²", decimals = 2 },
]

[tables.s1_real_time]
run = "volatility-managed/full"
table = "out_of_sample.csv"
where = { cap = 5.0 }
columns = [
    { column = "factor", header = "Factor" },
    { column = "cost_per_unit", header = "Cost (bp)", decimals = 0, scale = 10000.0 },
    { column = "sharpe_factor", header = "SR factor", decimals = 2 },
    { column = "sharpe_managed_net", header = "SR managed, net", decimals = 2 },
    { column = "z_hac", header = "z (HAC)", decimals = 2 },
    { column = "holm", header = "p Holm", decimals = 3 },
    { column = "mean_weight", header = "Mean weight", decimals = 2 },
    { column = "annual_turnover", header = "Turnover p.a.", decimals = 1 },
]
