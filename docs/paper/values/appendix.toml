# Values of the reproducibility appendix (design note 6.3d). Every study's runs share
# the same code, inputs and date, so the main run of each study stands for all of them.

[values.a_s1_commit]
run = "volatility-managed/paper"
record = "code.git_commit"
truncate = 12

[values.a_s1_version]
run = "volatility-managed/paper"
record = "code.qrlab"

[values.a_s1_dirty]
run = "volatility-managed/paper"
record = "code.git_dirty"

[values.a_s1_date]
run = "volatility-managed/paper"
record = "started"
truncate = 10

[values.a_s1_tried]
run = "volatility-managed/paper"
record = "configurations_tried"

[values.a_s1_seed]
run = "volatility-managed/paper"
record = "seed"

[tables.a_s1_inputs]
