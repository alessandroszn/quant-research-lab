# Example mapping for a fund holdings file (synthetic). Formats are declared, never guessed.
# Save the issuer's file under data/ and import it with qrlab.data.import_local_file.

file_format = "csv"              # "csv" or "xlsx" (an xlsx file needs sheet = "...")
skip_rows = 2                    # lines before the header (issuer preamble)
delimiter = ","
decimal_separator = "."
thousands_separator = ","        # "" means no thousands separator
encoding = "utf-8"
weight_unit = "percent"          # "percent" (12.5 = 12.5 %) or "decimal" (0.125)
missing_tokens = ["", "-"]       # cells meaning "unknown"
asset_class = "column"           # "column" to read it from the file, or a fixed class like "equity"
country_format = "iso_alpha2"    # "iso_alpha2" (US) or "name" (United States)

# Canonical field -> header in the file. name and weight are required; isin, country, sector,
# currency and asset_class are optional (unmapped fields are unknown for every holding).
# country must contain ISO 3166-1 alpha-2 codes.
[columns]
name = "Name"
weight = "Weight (%)"
isin = "ISIN"
country = "Country Code"
sector = "Sector"
currency = "Currency"
asset_class = "Asset Class"

# Issuer wording -> qrlab asset class (required when asset_class = "column").
[asset_class_values]
"Equity" = "equity"
"Cash" = "cash"
"Money Market" = "money_market"
