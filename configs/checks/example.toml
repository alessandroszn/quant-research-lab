# Example health-check thresholds. EXAMPLE VALUES, NOT RECOMMENDATIONS: choose your own.
#
# Every registered check must appear here. For each check:
#   enabled  = true | false
#   warning  = level that produces a warning
#   critical = level that produces a critical finding, or "none"
# The direction (whether higher or lower is worse) is fixed by the check, not by this file.
# Comparisons are strict: a value exactly at a threshold does not trigger.
# Weights and costs are fractions (0.20 = 20 %); money is in the portfolio's base currency.

[concentration.largest_position]   # weight of the largest position (higher is worse)
enabled = true
warning = 0.20
critical = 0.35

[concentration.top5]               # weight of the five largest positions
enabled = true
warning = 0.70
critical = 0.90

[concentration.herfindahl]         # sum of squared position weights (1 / effective positions)
enabled = true
warning = 0.20
critical = 0.35

[concentration.foreign_currency]   # largest exposure to one foreign currency
enabled = true
warning = 0.50
critical = 0.80

[lookthrough.country]             # largest country weight through fund holdings
enabled = true
warning = 0.60
critical = 0.80

[lookthrough.sector]              # largest sector weight through fund holdings
enabled = true
warning = 0.30
critical = 0.45

[lookthrough.issuer]              # largest issuer (security without an issuer map) weight
enabled = true
warning = 0.05
critical = 0.10

[lookthrough.pair_overlap]        # overlap of each pair of funds (redundant funds)
enabled = true
warning = 0.50
critical = 0.80

[lookthrough.duplicated]          # weight of securities reached through two or more positions
enabled = true
warning = 0.40
critical = 0.70

[diversification.average_correlation]   # mean pairwise correlation of position returns
enabled = true
warning = 0.85
critical = 0.95
window = 36                        # number of common returns used (e.g. 36 months)

[diversification.ratio]            # weighted volatility / portfolio volatility (lower is worse)
enabled = true
warning = 1.10
critical = 1.02
window = 36

[diversification.effective_bets]  # effective number of independent bets (lower is worse)
enabled = true
warning = 2.0
critical = 1.2
window = 36

[risk.volatility]                  # annualised volatility of the portfolio return series
enabled = true
warning = 0.18
critical = 0.25
periods_per_year = 12              # must match the frequency of the return series

[risk.max_drawdown]                # maximum drawdown, a negative number (lower is worse)
enabled = true
warning = -0.25
critical = -0.40

[risk.expected_shortfall]          # historical one-period ES, a positive loss
enabled = true
warning = 0.08
critical = 0.12
confidence = 0.95

[risk.beta]                        # beta against the benchmark return series
enabled = true
warning = 1.20
critical = 1.50

[risk.skewness]                    # skewness of returns (lower is worse: fatter left tail)
enabled = true
warning = -0.75
critical = -1.50

[costs.weighted_ter]               # weighted TER over the whole portfolio, a year
enabled = true
warning = 0.0040
critical = 0.0080

[costs.trading_drag]               # trade charges over average value, a year
enabled = true
warning = 0.0025
critical = 0.0075

[costs.total_cost]                 # weighted TER + trading drag, a year
enabled = true
warning = 0.0060
critical = 0.0120

[etf_quality.synthetic_share]     # weight in synthetically replicated funds
enabled = true
warning = 0.30
critical = 0.60

[etf_quality.domicile]             # weight in funds domiciled outside the preferred list
enabled = true
warning = 0.0
critical = "none"
preferred = ["IE", "LU"]

[etf_quality.distribution]         # weight in funds with a different distribution policy
enabled = true
warning = 0.0
critical = "none"
preferred = "accumulating"

[etf_quality.fund_size]            # fund assets in base currency (lower is worse), per fund
enabled = true
warning = 100000000
critical = 50000000

[etf_quality.fund_age]             # years since inception (lower is worse), per fund
enabled = true
warning = 3.0
critical = 1.0

[etf_quality.tracking_difference] # annualised fund return minus index return (lower is worse)
enabled = true
warning = -0.005
critical = -0.01

[etf_quality.tracking_error]      # annualised tracking error
enabled = true
warning = 0.01
critical = 0.02
periods_per_year = 12             # must match the frequency of the tracking series

[etf_quality.td_vs_ter]           # TD + TER: costs beyond the TER (lower is worse)
enabled = true
warning = -0.0025
critical = -0.005

[currency.unhedged_foreign]        # total weight exposed to currencies other than the base
enabled = true
warning = 0.60
critical = 0.85

[drift.max_deviation]              # largest absolute deviation from a target weight
enabled = true
warning = 0.05
critical = 0.10

[drift.total]                      # half the sum of absolute deviations (share to trade)
enabled = true
warning = 0.10
critical = 0.20

[data_quality.stale_prices]        # prices carried forward from an earlier date
enabled = true
warning = 0
critical = "none"

[data_quality.stale_fx]            # FX rates carried forward from an earlier date
enabled = true
warning = 0
critical = "none"

[data_quality.stale_master]        # instruments whose master data is older than max_age_days
enabled = true
warning = 0
critical = "none"
max_age_days = 365

[data_quality.missing_master]      # missing master-data fields (or records)
enabled = true
warning = 0
critical = "none"

[data_quality.pnl_residual]        # absolute P&L residual (should be zero)
enabled = true
warning = 0.01
critical = 1.0

[data_quality.stale_holdings]     # holdings snapshots older than max_age_days (count)
enabled = true
warning = 0
critical = "none"
max_age_days = 100
