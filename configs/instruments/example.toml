# Example instrument master data (synthetic: the ISINs are made up but have valid check digits).
#
# Keep your real list in data/ (git-ignored). One table per ISIN. Every key is required:
# write "unknown" for a value you do not know (never leave it out or guess). "unknown" is
# reported as missing for funds; for other instrument types fund-only fields must be "unknown".
#
# ter is a quoted decimal FRACTION: "0.0020" means 0.20 % per year.
# hedged_to is a currency for hedged share classes, or "none".
# fund_size is the fund's assets as { amount = "...", currency = "..." }, or "unknown".

[IE0000000012]
name = "Example World Equity UCITS ETF"
instrument_type = "etf"              # etf, etc, stock, bond, fund, cash
asset_class = "equity"               # equity, fixed_income, money_market, commodity, ...
currency = "USD"                     # base (NAV) currency
as_of = 2026-10-01                   # date you last checked the record against its source
domicile = "IE"
replication = "physical_sampling"    # physical_full, physical_sampling, synthetic
distribution = "accumulating"        # accumulating, distributing
ter = "0.0020"
benchmark = "Example World Index"
hedged_to = "none"
inception = 2009-09-25
fund_size = { amount = "85000000000", currency = "USD" }   # fund assets, or "unknown"
source = "KID dated 2026-03"

