name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Qt system libraries (Linux, for the off-screen app tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install (locked)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest --cov

  docs:
    # Design note 6.3b: the documentation builds with warnings as errors, and the examples in the
    # guides run as doctests. No network is needed (intersphinx is only enabled for releases).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install (locked, docs group)
        run: uv sync --locked --group docs
      - name: HTML (warnings are errors)
        run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html
      - name: Doctests
        run: uv run sphinx-build -W --keep-going -b doctest docs docs/_build/doctest
